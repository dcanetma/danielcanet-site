# cy.yml
# This workflow builds the website using Hexo 4.2.1
# and publishes to the web hosting using SFTP.

name: Build and publish website

on:
  workflow_dispatch:
  push:
    # It will publish changes on the 'deploy' branch, only.
    branches:
      - deploy

jobs:
  publish-website:
    name: Publish website
    runs-on: ubuntu-latest
    environment:
        name: 'production'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          cache: "npm"
          node-version: "25.1.0"

      - name: Build the website using Hexo
        run: echo "📦 Building Hexo application..."
          echo "🔧 Installing dependencies..."
          npm install
          echo "🏗️ Running build process..."
          npm run build
          echo "✅ New frontend build completed"
        env:
          CI: true

      - name: Publish website to server to Server
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
            ARGS: "-rlgoDzvc -i"
            SOURCE: "public/"
            REMOTE_HOST: ${{ vars.SERVER_URL }}
            TARGET: ${{ vars.SERVER_REMOTE_PATH }}
            REMOTE_PORT: ${{ secrets.SERVER_PORT }}
            REMOTE_USER: ${{ secrets.SERVER_USER }}
            SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

