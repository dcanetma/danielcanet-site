# cy.yml
# This workflow builds the website using Hexo 4.2.1
# and publishes to the web hosting using SFTP.

name: Build and publish website

on:
  workflow_dispatch:
  push:
    # It will publish changes on the 'deploy' branch, only.
    branches:
      - deploy

jobs:
  publish-website:
    name: Publish website
    runs-on: ubuntu-latest
    environment:
        name: 'production'

    steps:

      - name: Display Deployment Information
        run: |
            echo "Starting Frontend Deployment Process"
            echo "🚀 Current branch: ${{ github.ref_name }}"
            echo "🎯 Target environment: production"
            echo "⏰ Deployment started at: $(date)"
            echo "------------------------------------------------"

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          cache: "npm"
          node-version: "25.1.0"

      - name: Build the website using Hexo
        run: echo "📦 Building Hexo application..."
          echo "🔧 Installing dependencies..."
          npm install
          echo "🏗️ Running build process..."
          npm run build
          echo "✅ New frontend build completed"
        env:
          CI: true

      - name: Publish website to server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
            server: ${{ vars.SERVER_URL }}
            port: ${{ secrets.SERVER_PORT }}
            username: ${{ secrets.SERVER_USER }}
            ssh_private_key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
            local_path: './public/*'
            remote_path: ${{ vars.SERVER_REMOTE_PATH }}
            sftp_only: true
            delete_remote_files: false

